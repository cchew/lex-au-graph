[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[project]
name = "lex-au-graph"
version = "0.14.1"
description = "Cross-reference knowledge graph over AKN 3.0 XML corpus — retrieval layer of the AU Legislative Intelligence Stack"
authors = [{name = "Ching Chew", email = "ching.chew@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.3",
    "lxml>=5.3",
    "fastmcp>=2.0",
    "typer>=0.12",
    "anthropic>=0.40.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "huggingface_hub>=0.34",
]

[project.scripts]
lexaugraph = "lexaugraph.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "lexau-contract-fixtures @ git+https://github.com/cchew/lex-au@contract-fixtures-v2.0.0#subdirectory=contract-fixtures",
]

[tool.setuptools.packages.find]
where = ["src"]
